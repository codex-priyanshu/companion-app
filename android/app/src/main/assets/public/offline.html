<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffeely — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            padding: 24px;
        }
        .card {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: rgba(225, 48, 108, 0.12);
            border: 1px solid rgba(225, 48, 108, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }
        p {
            color: #a8a8a8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-retry {
            background: linear-gradient(135deg, #f9ce3f, #e1306c, #833ab4);
            color: #ffffff;
            border: none;
            padding: 13px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-retry:active { transform: scale(0.98); }
        .hint {
            margin-top: 20px;
            color: #737373;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">📡</div>
        <h1>No Internet Connection</h1>
        <p>Please check your mobile data or Wi-Fi network and try again.</p>
        <button class="btn-retry" onclick="window.location.reload()">🔄 Try Again</button>
        <div class="hint">Coffeely will reconnect automatically when network is restored.</div>
    </div>
</body>
</html>
